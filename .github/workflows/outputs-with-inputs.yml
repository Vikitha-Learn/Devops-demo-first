name: Build and Push Docker Image using outputs

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: Docker Hub repository name
        required: true
        type: string
        default: my-app
      image_tag:
        description: Docker image tag
        required: true
        type: string
        default: latest

jobs:
  build-and-push-outputs-job:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create image name from inputs
        id: image
        env:
          USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_NAME: ${{ inputs.image_name }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: echo "name=${USERNAME}/${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}

  show-outputs:
    needs: build-and-push-outputs-job
    runs-on: ubuntu-latest

    steps:
      - name: Display outputs from previous job
        env:
          IMAGE: ${{ needs.build-and-push-outputs-job.outputs.image }}
          DIGEST: ${{ needs.build-and-push-outputs-job.outputs.digest }}
        run: |
          echo "Pushed image: $IMAGE"
          echo "Image digest: $DIGEST"
