name: Python App & Docker Build Validation

on:
  push:
    branches: [ main ]

jobs:
  validate-and-build-job:
    runs-on: ubuntu-latest
    steps:
      # 1. You MUST check out the code first so the runner can see the file
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Now Python setup can safely look for the requirements.txt file
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # This will now succeed because requirements.txt exists

      # 3. Rest of your steps...
      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      - name: Build Docker Image Locally
        run: |
          docker build -t my-python-app:local .
