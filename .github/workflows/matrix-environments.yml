name: Matrix and Environments practice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flask-test-job:
    name: Python ${{ matrix.python-version }} - ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        environment: ["development", "staging"]

    environment:
      name: ${{ matrix.environment }}
      deployment: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Run Flask smoke test
        env:
          TARGET_ENV: ${{ matrix.environment }}
        run: |
          echo "Testing environment: $TARGET_ENV"

          python - <<'PY'
          from app import app

          client = app.test_client()
          response = client.get("/")

          print("Status code:", response.status_code)
          print("Response:", response.get_data(as_text=True))

          assert response.status_code == 200
          assert response.get_data(as_text=True) == "Hello, World!"

          print("PASS: Flask smoke test")
          PY
