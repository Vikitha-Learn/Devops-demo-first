name: GitHub Actions Practice Demo for Filters Contexts Expressions

# FILTERS: Decide when the workflow starts.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'

  # Allows you to run the workflow manually from the Actions tab.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose an environment'
        type: choice
        options:
          - dev
          - staging
          - Prod
          - qa
      run_extra_step:
        description: 'Run the extra practice step?'
        type: boolean
        default: false

# WORKFLOW-LEVEL VARIABLE
env:
  APP_NAME: github-actions-practice

# This practice workflow does not need repository permissions.
permissions: {}

jobs:
  practice-level-job:
    runs-on: ubuntu-latest

    # JOB-LEVEL VARIABLE
    env:
      JOB_MESSAGE: Hello from the practice job

    outputs:
      result: ${{ steps.create_output.outputs.result }}

    steps:
      - name: Display contexts
        # Pass context values through environment variables rather than
        # inserting potentially untrusted values directly into shell code.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUNNER_OS_NAME: ${{ runner.os }}
        run: |
          echo "Event: $EVENT_NAME"
          echo "Repository: $REPOSITORY"
          echo "Triggered by:${{ github.actor }} "
          echo "Ref name: $REF_NAME"
          echo "Runner OS: $RUNNER_OS_NAME"

      - name: Display variables
        # STEP-LEVEL VARIABLE
        env:
          STEP_MESSAGE: Hello from this step
          CONFIG_VALUE: ${{ vars.PRACTICE_MESSAGE || 'Not configured' }}
        run: |
          echo "Workflow variable: $APP_NAME"
          echo "Job variable: $JOB_MESSAGE"
          echo "Step variable: $STEP_MESSAGE"
          echo "Configuration variable: $CONFIG_VALUE"

      - name: Run only for pull requests
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Source branch: $SOURCE_BRANCH"
          echo "Target branch: $TARGET_BRANCH"

      - name: Display manual input
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          SELECTED_ENV: ${{ inputs.environment }}
        run: 
          echo "Selected environment: $SELECTED_ENV"

      - name: Optional manual step
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_extra_step }}
        run: echo "You selected the extra practice step."

      - name: Practice expression functions
        env:
          IS_FEATURE: ${{ startsWith(github.ref, 'refs/heads/feature/') }}
          IS_PUSH_OR_PR: ${{ contains(fromJSON('["push", "pull_request"]'), github.event_name) }}
        run: |
          echo "Feature branch ref: $IS_FEATURE"
          echo "Push or pull request event: $IS_PUSH_OR_PR"

      - name: Create a step output
        id: create_output
        run: echo "result=Practice completed successfully" >> "$GITHUB_OUTPUT"

      - name: Read the step output
        env:
          RESULT: ${{ steps.create_output.outputs.result }}
        run: 
         echo " Step output: $RESULT"

      - name: Run if a previous step fails
        if: ${{ failure() }}
        run: echo "A previous step failed."

  show-result-job:
    # Wait for the practice job to succeed.
    needs: practice-level-job
    runs-on: ubuntu-latest

    steps:
      - name: Read output from another job
        env:
          RESULT: ${{ needs.practice-level-job.outputs.result }}
        run: echo "Job output: $RESULT"
