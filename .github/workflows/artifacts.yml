name: Build, Upload, Download, and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag
        required: true
        type: string
        default: v3
jobs:
  build-artifacts-job:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set image name
        id: image
        env:
          DOCKER_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
        
          echo "name=${DOCKER_USERNAME}/my-app:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker build -t "$IMAGE" .

      - name: Save Docker image as a file
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: docker save -o image.tar "$IMAGE"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-artifact
          path: image1.tar
          retention-days: 1

  push-image-job:
    needs: build-artifacts-job
    runs-on: ubuntu-latest

    steps:
      - name: Download Docker image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image-artifact

      - name: Load Docker image
        run: docker load -i image1.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        env:
          IMAGE: ${{ needs.build-artifacts-job.outputs.image }}
        run: docker push "$IMAGE"
