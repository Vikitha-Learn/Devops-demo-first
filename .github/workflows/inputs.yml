name: Build and Push Docker Image by using inputs

on:
  workflow_dispatch:
    inputs:
      image_name:
        description: Docker Hub repository name
        required: true
        type: string
        default: my-app
      image_tag:
        description: Docker image tag
        required: true
        type: string
        default: latest

jobs:
  build-and-push-inputs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ inputs.image_tag }}
