name: Docker Artifact, Cache, and Smoke Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # JOB 1: Build the Docker image and upload it.
  build-container-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image with cache
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: my-app:latest

          # Restore cached build layers from earlier runs.
          cache-from: type=gha,scope=my-app

          # Save build layers for future runs.
          cache-to: type=gha,mode=max,scope=my-app

      - name: Check Docker image
        run: |
          docker images my-app:latest

      - name: Save Docker image as a tar file
        run: |
          docker save my-app:latest -o my-app.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: my-app.tar
          retention-days: 1

  # JOB 2: Download the image, test it, and export logs.
  run-container-job:
    needs: build-container-job
    runs-on: ubuntu-latest

    steps:
      - name: Prepare log directory
        run: |
          mkdir -p logs
          echo "Smoke test job started." > logs/smoke-test.log

      - name: Download Docker image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load -i my-app.tar

            - name: Run Flask smoke test
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "Starting Flask container..."

            docker run -d \
              --name practice-smoke \
              -p 127.0.0.1:5000:5000 \
              practice-app:latest

            echo "Waiting for the application to respond..."

            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error \
                http://127.0.0.1:5000/ \
                -o logs/response.txt; then

                echo "Response received:"
                cat logs/response.txt
                echo

                if [ "$(cat logs/response.txt)" != "Hello, World!" ]; then
                  echo "FAIL: Unexpected response body."
                  exit 1
                fi

                echo "PASS: Flask smoke test succeeded."
                exit 0
              fi

              if [ "$(docker inspect -f '{{.State.Running}}' practice-smoke)" != "true" ]; then
                echo "FAIL: Container stopped before responding."
                exit 1
              fi

              echo "Attempt $attempt: App is not ready yet."
              sleep 1
            done

            echo "FAIL: Application did not respond within 30 seconds."
            exit 1
          } 2>&1 | tee -a logs/smoke-test.log

      - name: Collect container logs
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p logs

          if docker container inspect practice-smoke > /dev/null 2>&1; then
            docker logs practice-smoke > logs/container.log 2>&1 || true
          else
            echo "Container was not created." > logs/container.log
          fi

      - name: Upload smoke-test logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: docker-smoke-test-logs
          path: logs/
          retention-days: 2

      - name: Remove test container
        if: ${{ always() }}
        run: |
          docker rm -f practice-smoke || true
